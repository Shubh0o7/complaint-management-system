services:
  - type: web
    name: campusresolve-php
    runtime: docker
    plan: free
    repo: https://github.com/Shubh0o7/complaint-management-system
    branch: master
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /login.php
    envVars:
      # These defaults connect to the MariaDB bundled in the image.
      # Replace all DB_* values when using an external managed database.
      - key: DB_HOST
        value: "127.0.0.1"
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        value: "complaint_user"
      - key: DB_PASS
        value: "complaint_pass"
      - key: DB_NAME
        value: complaint_system
      - key: APP_ENV
        value: production
      - key: APP_URL
        sync: false
      - key: MAIL_ENABLED
        value: "0"
