services:
  - type: web
    name: campusresolve-php
    runtime: docker
    plan: free
    repo: https://github.com/Shubh0o7/complaint-management-system
    branch: master
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /login.php
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_NAME
        value: complaint_system
      - key: APP_ENV
        value: production
      - key: APP_URL
        sync: false
      - key: MAIL_ENABLED
        value: "0"
